# Deploys the two Cloudflare Workers, which Cloudflare's timer starts every minute:
#   worker/     Echo: Instagram comment replies
#   cx-worker/  the CX watcher: TRIAL and claim auto-replies, day-1 follow-ups
# Runs when either Worker or the code it uses changes on main, or by hand.
#
# Needs one Actions secret: CLOUDFLARE_API_TOKEN (the account id is in each
# wrangler.toml). Until it exists this workflow does nothing and reports why. Each Worker's own
# secrets are copied from this repo's Actions secrets on every deploy, so GitHub
# stays the one place they are kept: IG_ACCESS_TOKEN for Echo, CHATWOOT_TOKEN and
# CHATWOOT_ACCOUNT_ID for the CX watcher (which is skipped until those two exist).

name: deploy-worker
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["worker/**", "cx-worker/**", "src/**", "rules.json"]

permissions:
  contents: read

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      CHATWOOT_TOKEN: ${{ secrets.CHATWOOT_TOKEN }}
      CHATWOOT_ACCOUNT_ID: ${{ secrets.CHATWOOT_ACCOUNT_ID }}
      SHOPIFY_WEBHOOK_SECRET: ${{ secrets.SHOPIFY_WEBHOOK_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the Cloudflare secrets are set
        id: ready
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::Cloudflare isn't connected yet (CLOUDFLARE_API_TOKEN not set), so nothing was deployed."
            echo "go=no" >> "$GITHUB_OUTPUT"
          else
            echo "go=yes" >> "$GITHUB_OUTPUT"
          fi
      - name: Test
        if: steps.ready.outputs.go == 'yes'
        run: node --version && node --test
      - name: Deploy Echo
        if: steps.ready.outputs.go == 'yes'
        working-directory: worker
        run: npx --yes wrangler@4 deploy
      - name: Give Echo the Instagram token
        if: steps.ready.outputs.go == 'yes'
        working-directory: worker
        run: |
          test -n "$IG_ACCESS_TOKEN" || { echo "::error::IG_ACCESS_TOKEN is not set in this repo's Actions secrets"; exit 1; }
          printf '%s' "$IG_ACCESS_TOKEN" | npx --yes wrangler@4 secret put IG_ACCESS_TOKEN
      - name: Deploy the CX watcher
        if: steps.ready.outputs.go == 'yes'
        working-directory: cx-worker
        run: |
          if [ -z "$CHATWOOT_TOKEN" ] || [ -z "$CHATWOOT_ACCOUNT_ID" ]; then
            echo "::notice::Chatwoot isn't connected yet (CHATWOOT_TOKEN / CHATWOOT_ACCOUNT_ID not set), so the CX watcher was not deployed."
            exit 0
          fi
          npx --yes wrangler@4 deploy
          printf '%s' "$CHATWOOT_TOKEN" | npx --yes wrangler@4 secret put CW_TOKEN
          printf '%s' "$CHATWOOT_ACCOUNT_ID" | npx --yes wrangler@4 secret put CW_ACC
          if [ -n "$SHOPIFY_WEBHOOK_SECRET" ]; then
            printf '%s' "$SHOPIFY_WEBHOOK_SECRET" | npx --yes wrangler@4 secret put SHOPIFY_WEBHOOK_SECRET
          else
            echo "::notice::SHOPIFY_WEBHOOK_SECRET is not set, so the Shopify paid-label address will answer 'not configured'."
          fi
