# Echo by hand: one pass over @enter.reverse's recent posts. Any comment that
# matches a keyword in rules.json gets its DM and a public reply.
#
# Echo's every-minute timer runs on Cloudflare (worker/, deployed by
# deploy-worker.yml). This workflow has no schedule: GitHub's own timer never
# fired on this repo, and two timers must never both send. Use it to run a pass
# by hand: Actions -> reply -> Run workflow (tick "dry run" to see what it would
# send without sending anything, or "diagnose" for extra detail).

name: reply
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (log only, send nothing)"
        type: boolean
        default: true
      diagnose:
        description: "Diagnose (extra detail on already-answered comments)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: echo-reply
  cancel-in-progress: false

jobs:
  reply:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      # No dependencies to install: Echo runs on the Node that ships with the runner (20 or newer).
      - name: Check rules.json
        run: node --version && node src/cli.js --check
      - name: Check the links in the DMs load
        run: node src/cli.js --check --links
      - name: Reply to matching comments
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IGNORE_BEFORE: ${{ vars.IGNORE_BEFORE }}
          DIAGNOSE: ${{ inputs.diagnose && '1' || '0' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: |
          test -n "$IG_ACCESS_TOKEN" || { echo "::error::IG_ACCESS_TOKEN is not set in this repo's Actions secrets"; exit 1; }
          node src/cli.js
