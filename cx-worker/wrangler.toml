# The hosted CX watcher: instant TRIAL and claim replies, and the day-1 follow-up.
name = "reverse-cx"
main = "src/index.js"
compatibility_date = "2026-11-01"
# The Reverse Cloudflare account. An account id is an address, not a password.
account_id = "7fae655d2b641cfe15a087237ef43b19"
# A public address is needed for one thing: Shopify's "order paid" notification (POST /shopify),
# which is only accepted when signed with SHOPIFY_WEBHOOK_SECRET.
workers_dev = true

[triggers]
crons = ["* * * * *"]

[vars]
# "1" = log what would be sent and send nothing. "0" = live.
DRY_RUN = "0"
# "on" = also send day-1 follow-ups. Leave "off" until paid customers are being labelled "paid" in Chatwoot.
FOLLOWUPS = "off"
# Days 3 and 5 are WhatsApp templates (claim_followup_day3, claim_followup_day5). Turn each "on" only once
# Meta shows it as Active on the CX number, and paying customers are being labelled "paid".
FOLLOWUP_DAY3 = "off"
FOLLOWUP_DAY5 = "off"
# The language code the templates were approved under ("en", or "en_US" / "en_GB" if that was picked).
TEMPLATE_LANGUAGE = "en"
# The pass counter (src/passes.js): each paid pass order on Shopify WhatsApps the user (Elijah) the new total and
# the buyer's journey. PASS_ALERT_CONV is his chat with Zoey's number in Chatwoot; "" switches it off.
# PASS_BASE_TOTAL is used only until a "Total: N" message exists in that chat (61, confirmed 22 Nov 2026).
PASS_ALERT_CONV = "410"
PASS_BASE_TOTAL = "61"

# "on" = WhatsApp the owner when a customer is still unanswered at 10 and 20 minutes, or a TRIAL or claim
# message got no auto-reply within 5 minutes. They go to the owner's own chat with the CX line:
ALERTS = "on"
ALERT_CONVERSATION = "410"

# Secrets (set by the deploy workflow, never committed): CW_TOKEN, CW_ACC, SHOPIFY_WEBHOOK_SECRET

# Keep each run's log lines in the Cloudflare dashboard (Workers > this Worker > Logs).
[observability]
enabled = true
